# Lidarr, slskd, Vidarr and the sync between them. install.sh sets this up; see README.md.
#
# All apps share one /data mount so imports can hardlink. Your download clients must see the
# same files; if they use different paths, set up Remote Path Mappings in Lidarr.
name: clippy-music

services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/lidarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8686:8686"
    restart: unless-stopped

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_USERNAME=${SLSKD_WEB_USERNAME}
      - SLSKD_PASSWORD=${SLSKD_WEB_PASSWORD}
      - SLSKD_SLSK_USERNAME=${SOULSEEK_USERNAME}
      - SLSKD_SLSK_PASSWORD=${SOULSEEK_PASSWORD}
      - SLSKD_DOWNLOADS_DIR=/data/downloads/soulseek/complete
      - SLSKD_INCOMPLETE_DIR=/data/downloads/soulseek/incomplete
    volumes:
      - ${APPDATA}/slskd:/app
      - ${DATA_ROOT}:/data
    ports:
      - "5030:5030"
      - "50300:50300"
    restart: unless-stopped

  vidarr:
    image: ghcr.io/chese79/vidarr:latest
    container_name: vidarr
    # Vidarr defaults to uid 1000. This runs it as your Unraid user so files stay accessible.
    user: "${PUID}:${PGID}"
    environment:
      - TZ=${TZ}
      - HOME=/config
    volumes:
      - ${APPDATA}/vidarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "3434:3434"
    restart: unless-stopped

  clippy-music-sync:
    image: python:3.13-alpine
    container_name: clippy-music-sync
    user: "${PUID}:${PGID}"
    command: ["python", "-u", "/app/clippy_music.py", "run"]
    environment:
      - LIDARR_URL=http://lidarr:8686
      - VIDARR_URL=http://vidarr:3434
      - LIDARR_API_KEY=${LIDARR_API_KEY}
      - VIDARR_API_KEY=${VIDARR_API_KEY}
      - VIDEO_ROOT=/data/media/music-videos
      - SYNC_INTERVAL_MINUTES=${SYNC_INTERVAL_MINUTES}
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./clippy_music.py:/app/clippy_music.py:ro
      - ./profiles.json:/app/profiles.json:ro
    depends_on:
      - lidarr
      - vidarr
    restart: unless-stopped
